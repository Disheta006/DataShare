{% extends 'base.html' %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">

        <h2 class="text-2xl font-bold text-center mb-2">Verify OTP</h2>
        <p class="text-sm text-gray-500 text-center mb-6">
            Enter the OTP sent to your mobile
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-3 px-4 py-2 rounded-lg text-sm
                    {% if message.tags == 'error' %}
                        bg-red-100 text-red-700
                    {% else %}
                        bg-green-100 text-green-700
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <input type="text" name="otp" maxlength="6"
                   placeholder="Enter OTP"
                   class="w-full border px-4 py-3 rounded-xl text-center tracking-widest text-lg focus:ring-2 focus:ring-blue-500 outline-none">

            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold">
                Verify
            </button>
        </form>

        <!-- Resend -->
        <form method="POST" action="{% url 'resend_reset_otp' %}" class="text-center mt-4">
            {% csrf_token %}
            <button class="text-sm text-blue-600 hover:underline">
                Resend OTP
            </button>
        </form>

        <!-- Demo OTP -->
        {% if otp_debug %}
        <div class="mt-4 bg-yellow-100 text-yellow-800 p-3 rounded-lg text-center">
            <strong>Demo OTP:</strong> {{ otp_debug }}
        </div>
        {% endif %}

    </div>
</div>

{% endblock %}
